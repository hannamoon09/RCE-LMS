spring:
  application:
    name: rce-lms
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 52MB
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
        path: /
app:
  session-cookie-secure: ${SESSION_COOKIE_SECURE:true}
  file-storage-path: ${FILE_STORAGE_PATH:../backend-data/uploads}
---
# Production settings also win when someone accidentally activates dev alongside prod.
spring:
  config:
    activate:
      on-profile: "prod | production"
  jpa:
    show-sql: false
server:
  forward-headers-strategy: native
  tomcat:
    redirect-context-root: false
  servlet:
    session:
      cookie:
        secure: true
app:
  session-cookie-secure: true
  file-storage-path: ${FILE_STORAGE_PATH}
debug: false
logging:
  level:
    root: INFO
