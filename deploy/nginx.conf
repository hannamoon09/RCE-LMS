# Install as an nginx conf.d server configuration after replacing hostname,
# certificate paths and dist root. Spring Boot runs privately on localhost:8080.
server {
    listen 80;
    server_name lms.example.com;
    return 308 https://lms.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name lms.example.com;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/rce-lms/frontend/dist;
    index index.html;
    client_max_body_size 52m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_read_timeout 60s;
    }

    # Only the frontend build directory is public. Never alias uploads or the repository.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
    location ~ /\. { deny all; }
}
